name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jmbbianchi/obra493-backend   # el package NO se llama igual que el repo
  RG: rg-obra493
  APP: obra493-backend
  JOB: obra493-indices

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push a GHCR
      id-token: write        # login federado a Azure (OIDC, sin secretos)

    steps:
      - uses: actions/checkout@v4

      # Sin esto, build-push-action usa el driver "docker" por defecto,
      # que NO soporta el cache de GitHub Actions (type=gha) y muere en 14s
      # con "buildx failed with: ... build-cache-backends".
      - name: Preparar buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatico, no hay que crearlo

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login a Azure
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update -g $RG -n $APP \
              --image ${{ env.IMAGE }}:${{ github.sha }}
            # OJO: el az CLI no acepta valores que empiecen con guion en
            # --args (Azure/azure-cli#27011), asi que "-m app.jobs.indices"
            # es imposible. Por eso la imagen trae /app/run_indices.py.
            az containerapp job update -g $RG -n $JOB \
              --image ${{ env.IMAGE }}:${{ github.sha }} \
              --command "python" \
              --args "run_indices.py"

      - name: URL
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "API: https://$(az containerapp show -g $RG -n $APP \
              --query properties.configuration.ingress.fqdn -o tsv)"